<!-- GitHub Pages serves this file for any path it does not have. A path-style link
     (…/Little-House-Flower/flowers/white-rose) is sent to the same page in the site's
     hash router (…/Little-House-Flower/#/flowers/white-rose); anything unknown lands
     on the site's own not-found page. The site root is the project folder on
     *.github.io and "/" anywhere else, so a deeper path never loops back here. -->
<script>
(function () {
  var parts = location.pathname.split('/');
  var onPages = /\.github\.io$/.test(location.hostname) && parts.length > 2;
  var base = onPages ? '/' + parts[1] + '/' : '/';
  var rest = location.pathname.slice(base.length).replace(/^\/+/, '').replace(/(index|404)\.html?$/, '');
  location.replace(base + location.search + (rest ? '#/' + rest : ''));
})();
</script>
