})();

/* ---- core/booking-engine.js ---- */
/* =====================================================================
   booking engine — pure rules (no DOM, no IO). Fed by settings + load.
   ===================================================================== */

/* The shop's clock. Lead time, the 18:00 cut-off, same-day windows and the
   calendar's "today" all run on Bangkok time, whatever zone the visitor's phone
   is set to: someone ordering from London must not be offered a slot that
   closed hours ago in Nonthaburi. */
LHF.time = (function () {
  const TZ = 'Asia/Bangkok';
  let fmt = null;
  try { fmt = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }); } catch (e) { fmt = null; }
  const pad = (n) => (n < 10 ? '0' : '') + n;
  /* now(at?) → {y, m, d, hh, mi, dow, minutes, iso} for the instant `at` (default: this moment) */
  function now(at) {
    const ms = at == null ? Date.now() : at instanceof Date ? at.getTime() : Number(at);
    let y = 0, m = 0, d = 0, hh = 0, mi = 0;
    if (fmt) {
      const p = {};
      fmt.formatToParts(new Date(ms)).forEach((x) => { p[x.type] = x.value; });
      y = +p.year; m = +p.month; d = +p.day; hh = (+p.hour) % 24; mi = +p.minute;
    }
    if (!(y > 0)) {
      /* Bangkok has kept UTC+7, with no daylight saving, since 1920 */
      const b = new Date(ms + 7 * 3600e3);
      y = b.getUTCFullYear(); m = b.getUTCMonth() + 1; d = b.getUTCDate(); hh = b.getUTCHours(); mi = b.getUTCMinutes();
    }
    return { y, m, d, hh, mi, dow: new Date(Date.UTC(y, m - 1, d)).getUTCDay(), minutes: hh * 60 + mi, iso: y + '-' + pad(m) + '-' + pad(d) };
  }
  const today = (at) => now(at).iso;
  /* a date and 'HH:MM' on the shop's clock → that instant (for calendar files) */
  function toUTC(dateISO, hhmm) {
    const [y, m, d] = String(dateISO).split('-').map(Number);
    const [hh, mi] = String(hhmm || '00:00').split(':').map(Number);
    return new Date(Date.UTC(y, m - 1, d, (hh || 0) - 7, mi || 0));
  }
  return { TZ, now, today, toUTC };
})();

LHF.engine = (function () {
  const U = LHF.util;

  /* 'now' is injectable for tests; today and hour are read on the shop's clock */
  function ctx(settings, now) {
    const n = LHF.time.now(now);
    const hours = LHF.data.shop.hours;
    return { settings, now: now || new Date(), today: n.iso, hour: n.hh + n.mi / 60, open: parseInt(hours.open, 10), close: parseInt(hours.close, 10), horizon: horizon(n.iso, (settings && settings.monthsAhead) || 3) };
  }
  /* the calendar offers this month and the next three; nothing past that is bookable */
  function horizon(todayISO, monthsAhead) {
    const [y, m] = todayISO.split('-').map(Number);
    return U.iso(new Date(y, m + monthsAhead, 0));
  }

  /* Earliest selectable date given lead time and cut-off. */
  const leadOf = (c, opts) => Math.max(0, Number(opts && opts.leadDays != null ? opts.leadDays : c.settings.leadTimeDays || 0));
  function earliestDate(c, opts) {
    const lead = leadOf(c, opts);
    let d = U.addDays(c.today, lead);
    // after the cut-off hour, tomorrow is no longer bookable online
    if (lead > 0 && c.hour >= (c.settings.cutoffHour || 24)) d = U.addDays(d, 1);
    return d;
  }

  /* A written brief rides with the order once it was sent on from /custom, even if
     a bouquet was added afterwards (drafts older than the `ready` flag only carry
     type 'custom'). */
  const hasBrief = (d) => !!(d && d.custom && (d.type === 'custom' || d.custom.ready));

  /* One lead time for the whole order: the longest of the shop's minimum, each
     bouquet in it, and the brief (two days, or the lead of the product the brief
     asks about). The calendar, the step checks and the final send all use it. */
  function leadFor(d, settings) {
    const C = LHF.catalog;
    const own = (id) => Number((C.byId(id) || {}).leadDays) || 1;
    const parts = [Number((settings || {}).leadTimeDays) || 1].concat((d.items || []).map((it) => own(it.productId)));
    if (hasBrief(d)) { const from = d.custom.fromProduct; parts.push(from && C.byId(from) ? own(from) : 2); }
    return Math.max.apply(null, parts);
  }

  /* Status of a single date. load = {orders, custom, windows} or undefined */
  function dateStatus(dateISO, c, load, opts) {
    opts = opts || {};
    const s = c.settings;
    if (dateISO < c.today) return { ok: false, reason: 'past' };
    if (c.horizon && dateISO > c.horizon) return { ok: false, reason: 'horizon' };
    if ((s.blackoutDates || []).includes(dateISO)) return { ok: false, reason: 'closed' };
    /* while a high-demand campaign is on, its deadline actually closes later dates */
    if (s.highDemand && s.highDemand.active && s.highDemand.deadline && dateISO > s.highDemand.deadline) return { ok: false, reason: 'closed' };

    /* 'cutoff': the lead time alone would allow it, but today's 18:00 has passed */
    if (dateISO < earliest) return { ok: false, reason: dateISO === c.today ? 'today' : dateISO >= U.addDays(c.today, leadOf(c, opts)) ? 'cutoff' : 'leadtime' };
    const orders = load ? load.orders : 0;
    const custom = load ? load.custom : 0;
    /* 0 means "closed today", not "unlimited" */
    const cap = Number(s.maxOrdersPerDay);
    if (Number.isFinite(cap) && orders >= cap) return { ok: false, reason: 'full' };
    const capCustom = Number(s.maxCustomPerDay);
    if (opts.type === 'custom' && Number.isFinite(capCustom) && custom >= capCustom) return { ok: false, reason: 'full' };
    const remaining = Number.isFinite(cap) ? cap - orders : null;

  /* Windows for a date + fulfilment ('delivery' | 'pickup') with capacity. */

    const s = c.settings;

    const isToday = dateISO === c.today;
    return list.map((w) => {
      const used = load && load.windows ? load.windows[w.id] || 0 : 0;
      const cap = Number(capPer);
      const full = Number.isFinite(cap) ? used >= cap : false;
      const startH = parseInt(w.start, 10);
      const gone = isToday && c.hour + 3 > startH;   // same-day windows need ≥3h notice
      return Object.assign({}, w, { used, full, gone, ok: !full && !gone, remaining: Number.isFinite(cap) ? cap - used : null });
    });
  }

  /* Calendar matrix: array of weeks, each 7 cells {iso, inMonth} (Sunday first).
     Exactly the weeks that hold a day of the month, never a row of next month only. */
  function monthMatrix(year, month) {
    const first = new Date(year, month, 1);
    const start = new Date(year, month, 1 - first.getDay());
    const rows = Math.ceil((first.getDay() + new Date(year, month + 1, 0).getDate()) / 7);
    const weeks = [];
    for (let w = 0; w < rows; w++) {
      const row = [];
      for (let d = 0; d < 7; d++) {
        const cur = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + d);
        row.push({ iso: U.iso(cur), inMonth: cur.getMonth() === month, day: cur.getDate() });
      }

    }
    return weeks;
  }

  /* Order reference: LH + yymmdd + 4 chars, e.g. LH260905-K7MQ */
  function orderRef(dateISO) {
    const d = (dateISO || LHF.time.today()).replace(/-/g, '').slice(2);
    return 'LH' + d + '-' + U.rnd(4);
  }

  /* ---- price summary ---- */
  /* How a product's price may be stated on an order today:
     'firm'  the shop's own price, inside its validity date
     'from'  a starting price ('from' and 'range'); the shop confirms the total

  function priceKind(p, today) {
    if (!p || p.pricing === 'quote' || !(Number(p.price) > 0)) return 'quote';
    const until = p.priceValidUntil || (LHF.data.policies || {}).priceValidUntil;
    if (until && (today || LHF.time.today()) > until) return 'quote';
    return p.pricing === 'from' || p.pricing === 'range' ? 'from' : 'firm';
  }
  function priceSummary(draft) {
    const today = LHF.time.today();

    const items = (draft.items || []).map((it) => {
      const p = LHF.catalog.byId(it.productId);
      if (!p) return null;
      /* a quantity stacked by re-adding, or edited in storage, stays inside the product's range */
      const qty = U.clamp(Math.floor(Number(it.qty)) || 1, 1, p.maxQty || 20);
      const kind = priceKind(p, today);
      const unit = kind === 'quote' ? 0 : tierPrice(p, qty);

    }).filter(Boolean);
    const subtotal = items.reduce((a, b) => a + b.line, 0);
    const brief = hasBrief(draft);
    /* hasQuote: part of the order has no price yet. priceFrom: every price is known
       but at least one is a starting price, so the total is "from". Either way the

    const priceFrom = !hasQuote && items.some((i) => i.kind === 'from');

  }
  function tierPrice(p, qty) {
    if (!p.tiers) return p.price || 0;

    p.tiers.forEach((t) => { if (qty >= t.min) unit = t.price; });
    return unit;
  }

  /* ---- phones ----
     The orderer may be anywhere (children abroad order for their parents): a Thai
     mobile, a Thai landline, or + country code with 8–15 digits. The recipient is
     called by the rider, so the recipient needs a Thai mobile. Thai and full-width
     digits count; +66 and 66 fold into the leading 0. */
  function normPhone(s) {
    let v = String(s || '').replace(/[๐-๙]/g, (ch) => String(ch.charCodeAt(0) - 0x0E50)).replace(/[０-９]/g, (ch) => String(ch.charCodeAt(0) - 0xFF10)).trim();

    v = v.replace(/\D/g, '');
    if (!intl) return /^66[689]\d{8}$/.test(v) ? '0' + v.slice(2) : v;
    if (v.startsWith('00')) v = v.slice(2);
    if (v.startsWith('66')) return '0' + v.slice(2).replace(/^0/, '');
    return '+' + v;
  }
  const isMobileTH = (s) => /^0[689]\d{8}$/.test(normPhone(s));
  const isCustomerPhone = (s) => { const n = normPhone(s); return /^0[689]\d{8}$/.test(n) || /^0[2-7]\d{7}$/.test(n) || /^\+[1-9]\d{7,14}$/.test(n); };
  function fmtPhone(s) {
    const n = normPhone(s);
    if (/^0\d{9}$/.test(n)) return n.slice(0, 3) + ' ' + n.slice(3, 6) + ' ' + n.slice(6);
    if (/^0\d{8}$/.test(n)) return n.slice(0, 2) + ' ' + n.slice(2, 5) + ' ' + n.slice(5);

  /* ---- validation ---- */

})();

/* ---- core/sink.js ---- */
/* =====================================================================
   sink — delivery of a finished reservation to the shop's Google Sheet,
   through the Apps Script Web App in google/Code.gs.

   Three facts shape the whole file:

   1. The customer is told an order reached the shop only after the script
      answers with JSON ok === true. deliver() is awaited by the order page;
      anything else (no endpoint, a network error, a timeout, an HTML error
      page, {ok:false}) comes back as a failure the customer reads on screen,
      with LINE and the phone as the other ways in. A queued message is not a
      delivered one, and the shop cannot see a queue that lives on the
      customer's phone.

   2. Inside a published Claude Artifact the browser blocks every outbound
      request to every host, silently. There the artifact's own database is
      the record (see db.js), so we deliver nothing and store nothing here;
      we only count what the Sheet is still owed.

   3. The endpoint comes from sheet.json, fetched from the deployed folder
      (and retried, and awaited before a send), over the value baked in at
      build time. Nothing typed into a browser can repoint it.

   The outbox below is legacy: an older version of the site queued rows in
   visitors' browsers and posted them in the background. It still drains
   what is left there, once, strictly, and deletes what is a week old.
   ===================================================================== */
LHF.sink = (function () {
  const U = LHF.util;
  const BOX = 'lhf.sink.outbox';
  const ST = 'lhf.sink.state';
  const MAX_ITEMS = 60;             // hard ceiling on rows held in one browser
  const MAX_AGE_MS = 7 * 864e5;     // a week undelivered is a dead letter
  const MAX_ATTEMPTS = 12;
  const BASE_MS = 4000;
  const CAP_MS = 10 * 60000;
  const SENT_KEEP = 400;            // refs remembered so a backfill cannot double-send
  const TIMEOUT_MS = 25000;         // Apps Script cold starts can take several seconds

  const listeners = new Set();
  let timer = null, running = false;

  /* The artifact viewer is the one place fetch cannot work. window.claude is
     the only honest signal we have, and it is present exactly there. */

  const thai = (k) => { const e = (LHF.data.strings || {})[k]; return (e && e.th) || ''; };
  const load = () => { const q = U.storage.get(BOX, []); return Array.isArray(q) ? q : []; };
  const save = (q) => U.storage.set(BOX, q);
  const state = () => Object.assign({ lastOkAt: 0, lastErr: '', dropped: 0, owed: 0, sent: {} }, U.storage.get(ST, {}));
  const setState = (patch) => { const s = Object.assign(state(), patch); U.storage.set(ST, s); return s; };

  /* Endpoint precedence: sheet.json fetched from the deployed folder beats the
     value baked in at build time, so the shop can repoint the site by editing
     one small file in the repository instead of rebuilding a four-megabyte
     bundle. Settings saved in a browser are never consulted. */

  function cfg() {
    const baked = window.__LHF_SHEET || {};
    const rt = runtime || {};
    const endpoint = String(rt.endpoint || baked.endpoint || '').trim();
    const secret = String(rt.endpoint ? rt.secret || '' : baked.secret || '');
    const on = runtime ? rt.enabled !== false : baked.enabled !== false;
    /* The destination is allow-listed in code: an unvalidated URL would be a
       one-line switch for sending every customer's name, phone and address
       somewhere else. localhost is for development. */

    return { endpoint, secret };
  }

  function loadConfig() {
    if (runtime || blocked) return Promise.resolve(runtime);
    if (!cfgLoading) {
      cfgLoading = (async () => {
        for (let i = 0; i < 3 && !runtime; i++) {
          if (i) await U.wait(700 * i);
          try {
            const r = await Promise.race([fetch('sheet.json', { cache: 'no-store' }), U.wait(8000).then(() => { throw new Error('timeout'); })]);
            const j = r.ok ? await r.json() : null;
            if (j && typeof j === 'object') runtime = { enabled: j.enabled !== false, endpoint: String(j.endpoint || ''), secret: String(j.secret || '') };
            else if (r.status === 404) break;   // no file deployed: the baked value stands
          } catch (e) { /* offline or blocked: try again */ }
        }
        cfgLoading = null;
        emit();
        return runtime;
      })();
    }
    return cfgLoading;
  }

  /* ---------- the row ----------------------------------------------------
     One named field per Sheet column. Named, never positional: an older copy
     of the site in somebody's cache must not be able to shift every column
     by one. google/Code.gs maps these onto the header it owns, so the names
     below never change; anything new rides inside an existing text field. */
  const CAP = { name: 120, line: 40, address: 500, landmark: 200, district: 80, card: 200, brief: 2000, items: 1000 };
  const clip = (v, n) => { const s = String(v == null ? '' : v).trim(); return s.length > n ? s.slice(0, n) + '…' : s; };
  /* A cell that starts with = + - @ (or a tab or return) is run as a formula by
     Sheets and by spreadsheet apps opening an export. A leading apostrophe
     makes it plain text, and Sheets does not show the apostrophe. */

  function phoneCell(s) {
    const n = LHF.engine.normPhone(s);
    if (/^0\d{9}$/.test(n)) return n.slice(0, 3) + '-' + n.slice(3, 6) + '-' + n.slice(6);
    if (/^0\d{8}$/.test(n)) return n.slice(0, 2) + '-' + n.slice(2, 5) + '-' + n.slice(5);
    return clip(n, 20);
  }
  const STATUS_TH = { new: 'รอยืนยัน' };
  function fields(b) {
    b = b || {};
    const cust = b.customer || {}, rec = b.recipient || {}, addr = b.address || null;
    const c = b.custom || null;
    /* the florist reads Thai, whatever language the customer ordered in */
    const items = (b.items || []).map((i) => (i.qty > 1 ? i.qty + ' × ' : '') + (i.nameTh || thName(LHF.catalog.byId(i.productId)) || i.name) + (i.kind === 'from' ? ' (ราคาเริ่มต้น)' : i.kind === 'quote' ? ' (สอบถามราคา)' : '')).join(' + ');
    const row = {
      received: bkkStamp(b.createdAt),

      dateNeeded: b.date || '',
      window: b.windowLabel || '',
      fulfil: thai('book.how.' + b.fulfil) || b.fulfil || '',
      items: clip(items, CAP.items),
      brief: clip(brief(b), CAP.brief),

  /* ---------- delivery, awaited by the order page ----------

    if (!c) return { ok: false, reason: 'no_endpoint' };
    const body = JSON.stringify({ v: 1, secret: c.secret, source: 'web', hp: String(opts.hp || ''), reservations: [fields(booking)] });

      return { res, ack };

      if (ack && ack.ok === true) {
        markSent(booking.id || booking.ref);
        setState({ lastOkAt: Date.now(), lastErr: '' });
        return { ok: true, ack };
      }
      const reason = ack && ack.ok === false ? String(ack.error || 'rejected') : !res.ok ? 'http_' + res.status : 'bad_response';
      setState({ lastErr: reason });
      return { ok: false, reason };
    } catch (e) {
      const reason = timedOut ? 'timeout' : 'network';
      setState({ lastErr: reason });
      return { ok: false, reason };

  /* ---------- the same order in words, for LINE, the clipboard and the calendar ---------- */

    if (c) {
      const p = c.fromProduct && LHF.catalog.byId(c.fromProduct);
      lines.push('• ' + t('custom.summary') + ': ' + [p ? pick(p.name) : '', t('custom.style.' + (c.style || 'bouquet')), c.occasion ? pick(LHF.catalog.occasion(c.occasion) || {}) : '', budgetLabel(c)].filter(Boolean).join(' · '));

  /* Inside the artifact this only counts what the Sheet is owed. Elsewhere new

  function send(booking) {

    if (s.sent && s.sent[key]) return status();

  function prune(q) {

  /* --- story --- */
  'story.title': { th: 'บ้านหลังเล็ก', en: 'A little house' },
  'story.eyebrow': { th: 'Little House Flower · นนทบุรี', en: 'Little House Flower · Nonthaburi' },
  'story.p1': { th: 'Little House Flower เป็นร้านดอกไม้เล็กๆ ย่านรัตนาธิเบศร์ นนทบุรี จัดดอกไม้สดด้วยมือทีละช่อ และส่งไปทั่วนนทบุรีและกรุงเทพฯ ทุกวัน 08.00–20.00 น.', en: 'Little House Flower is a small florist in the Rattanathibet area of Nonthaburi. Every bouquet is hand-tied, one at a time, and sent across Nonthaburi and Bangkok, every day from 08.00 to 20.00.' },
  'story.p2': { th: 'ทุกช่อออกจากร้านพร้อมป้ายหัวใจสีชมพู และการ์ดข้อความที่ทางร้านเขียนด้วยลายมือให้ฟรี ริบบิ้น LOVE IS ETERNAL เป็นหนึ่งในแบบห่อที่ทางร้านใช้บ่อย ดอกไม้แต่ละชนิดมีความหมายต่างกัน ทางร้านจึงเขียนความหมายไว้ให้ เลือกจากสิ่งที่อยากบอกได้เลยค่ะ', en: 'Every bouquet leaves with our pink heart tag and a free handwritten card, and the LOVE IS ETERNAL ribbon is one of our signature wraps. Every flower means something, so we write the meanings down: choose by what you want to say.' },

/* Price-validity lines read the one date in data/settings.js. Once it has passed
   (Bangkok calendar) they are emptied, and ui.head() leaves out an empty eyebrow,
   so no page promises an expired price. */
(function () {
  const S = LHF.data.strings, until = LHF.data.policies.priceValidUntil;
  const fill = (lang) => LHF.i18n.fmtDate(until, 'long', lang);
  /* custom.budget.hint quotes this period's posted range (250.– to 2,690.–), so it goes quiet with the prices */
  ['home.today.eyebrow', 'custom.budget.hint'].forEach((k) => {
    if (!S[k]) return;
    S[k] = LHF.data.pricesCurrent ? { th: S[k].th.replace('{until}', fill('th')), en: S[k].en.replace('{until}', fill('en')) } : { th: '', en: '' };
  });
})();

  /* After the price-validity date (Bangkok calendar) every priced design becomes
     "price on request": these are the shop's prices for this period only, and an
     expired figure must never be shown, quoted or summed into a total. */
  if (!LHF.data.pricesCurrent) {
    products.forEach((p) => {
      if (p.pricing === 'quote') return;
      Object.assign(p, { pricing: 'quote', price: null, priceMax: null, tiers: null });
      delete p.priceValidUntil;
      if (p.notesArePrices) p.notes = null;
    });
  }

  const byId = (id) => products.find((p) => p.id === id);
  const bySlug = (slug) => products.find((p) => p.slug === slug || p.id === slug);
  const occasion = (id) => occasions.find((o) => o.id === id);
  const color = (id) => colors.find((c) => c.id === id);
  const category = (id) => categories.find((c) => c.id === id);
  const flower = (id) => flowers[id];

  function filter(opts) {
    opts = opts || {};
    return products.filter((p) =>
      (!opts.category || p.category === opts.category) &&
      (!opts.occasion || (p.occasions || []).includes(opts.occasion)) &&
      (!opts.color || (p.colors || []).includes(opts.color)) &&
      (!opts.availability || p.availability === opts.availability) &&
      (opts.includeSeasonal || p.availability !== 'seasonal' || opts.occasion === p.season)
    ).sort((a, b) => a.order - b.order);
  }
  /* "change the colours · free card" is bouquet talk; on a funeral wreath or a jasmine garland it reads wrong */
  const customisable = (p) => !['wreath', 'garland'].includes(p.category);
  const featured = () => products.filter((p) => p.featured).sort((a, b) => a.order - b.order);
  const related = (p, n) => products.filter((q) => q.id !== p.id && q.image && q.availability !== 'seasonal' && (q.category === p.category || q.occasions.some((o) => p.occasions.includes(o)))).slice(0, n || 3);

  return { flowers, colors, categories, occasions, products, byId, bySlug, occasion, color, category, flower, filter, featured, related, customisable };
})();

/* =====================================================================
   image — LQIP → full image, graceful fallback (never a broken icon)
   Photos are files in img/. The map keeps each one's size, alt text,
   a tiny inline LQIP that shows while the file loads and, for photos
   wider than 800 px, a 640 px copy (srcset).
   ===================================================================== */
LHF.img = (function () {
  const U = LHF.util, h = U.h;
  const I = () => window.__LHF_IMAGES || {};
  const meta = (key) => I()[key] || null;
  const src = (key) => (meta(key) || {}).src || '';
  const alt = (key) => { const m = meta(key); if (!m) return ''; return LHF.i18n.lang === 'th' ? m.alt_th || m.alt_en : m.alt_en || m.alt_th; };

  /* Give an <img> its file once its box has a width. With a srcset, `sizes` is that width, so a
     two-column card on a phone fetches the 640 px copy and the product page the full photo, with
     no caller having to know the layout. An eager photo in view, or in the first screen of its
     page (a new page renders before the scroll resets), is fetched first: on home that is the
     hero, not the rail cards below it. */
  function source(im, box, m, eager, then) {
    const go = (w) => {
      const r = box.getBoundingClientRect(), vh = window.innerHeight || 800;
      if (eager && ((r.top < vh && r.bottom >= 0) || r.top + (window.scrollY || 0) < vh)) im.setAttribute('fetchpriority', 'high');
      if (w && m.srcset) { im.sizes = Math.ceil(w) + 'px'; im.srcset = m.srcset; }
      im.src = m.src;
      if (then) then();
    };
    if (typeof ResizeObserver !== 'function') return go(0);
    const ro = new ResizeObserver((entries) => { const w = entries[0].contentRect.width; if (!w) return; ro.disconnect(); go(w); });
    ro.observe(box);
  }

  /* pic(key, {className, pos, eager, ratio, sizes, decorative}) */
  function pic(key, opts) {
    opts = opts || {};
    const m = meta(key);
    /* a small source (the 360 px reel stills, the cropped photos) is never blown up past 1.5× its width */
    const cap = m && m.w < 700 ? { maxWidth: Math.round(m.w * 1.5) + 'px' } : {};
    const wrap = h('div.pic', { class: opts.className, style: Object.assign(cap, opts.ratio ? { aspectRatio: opts.ratio } : {}, opts.style || {}) });
    if (!m) {
      wrap.classList.add('is-loaded');
      wrap.appendChild(h('div.pic-fallback', h('span', LHF.i18n.t('img.fallback')), h('a.tlink', { href: LHF.data.shop.instagram, target: '_blank', rel: 'noopener' }, 'Instagram')));
      return wrap;
    }
    const a = opts.decorative ? '' : (opts.alt || alt(key));
    if (m.lqip) {
      const lq = h('img.lq', { src: m.lqip, alt: '', 'aria-hidden': 'true', width: m.w, height: m.h });
      wrap.appendChild(lq);
    }
    /* an eager photo (hero, product, viewer) paints as it arrives over its LQIP instead of fading
       in after it has loaded; lazy ones keep the fade from the blur */
    const im = h('img.hi', { alt: a, width: m.w, height: m.h, loading: opts.eager ? 'eager' : 'lazy', decoding: 'async', style: Object.assign(opts.pos ? { objectPosition: opts.pos } : {}, opts.eager ? { opacity: 1, transition: 'none' } : {}), draggable: 'false' });
    const done = () => wrap.classList.add('is-loaded');
    im.addEventListener('load', done, { once: true });
    im.addEventListener('error', () => {
      im.remove();
      wrap.classList.add('is-loaded');
      wrap.appendChild(h('div.pic-fallback', h('span', LHF.i18n.t('img.fallback')), h('a.tlink', { href: LHF.data.shop.instagram, target: '_blank', rel: 'noopener' }, 'Instagram')));
    }, { once: true });
    wrap.appendChild(im);
    source(im, wrap, m, opts.eager, () => {
      if (im.decode) im.decode().then(done).catch(() => {});
      if (im.complete && im.naturalWidth) done();
    });
    /* never leave a loaded photo behind its blur; one still on its way keeps the LQIP */
    setTimeout(() => { if (im.complete && im.naturalWidth) done(); }, 1800);
    return wrap;
  }

  /* plain <img> (small thumbs, logo) */
  function el(key, opts) {
    opts = opts || {};
    const m = meta(key);
    if (!m) return h('span.thumb-empty', { class: opts.className });
    const im = h('img', { alt: opts.alt != null ? opts.alt : alt(key), width: m.w, height: m.h, class: opts.className, loading: opts.eager ? 'eager' : 'lazy', decoding: 'async', draggable: 'false', style: opts.style || null });
    /* a thumbnail of a big photo takes the 640 px copy; small files (logo, highlights) load as they are */
    if (m.srcset) source(im, im, m, false); else im.src = m.src;
    return im;
  }

  const ratio = (key) => { const m = meta(key); return m ? m.w / m.h : 0.8; };
  return { pic, el, meta, src, alt, ratio };
})();

    { keys: ['ยินดี', 'สำเร็จ', 'จบ', 'รับปริญญา', 'เก่ง', 'ภูมิใจ', 'congrat', 'proud', 'graduat', 'success', 'well done'], flowers: ['lily', 'carnation', 'gerbera', 'rose_white'] },
    { keys: ['มีความสุข', 'สุขสันต์', 'สุขภาพ', 'หายไว', 'แข็งแรง', 'happy', 'birthday', 'get well', 'health', 'joy', 'smile', 'ยิ้ม'], flowers: ['stock', 'gerbera', 'carnation'] },
    { keys: ['ลึกซึ้ง', 'ลึกลับ', 'ตลอดไป', 'มั่นคง', 'forever', 'always', 'deep', 'eternal'], flowers: ['rose_red', 'black_wrap'] },
    { keys: ['เริ่มต้นใหม่', 'บ้านใหม่', 'งานใหม่', 'new beginning', 'new job', 'new home', 'fresh start'], flowers: ['rose_white', 'lily'] },
    { keys: ['เพื่อน', 'มิตรภาพ', 'friend'], flowers: ['lisianthus'] },

/* =====================================================================
   calendar — accessible month grid driven by the booking engine
   ===================================================================== */

  const U = LHF.util, h = U.h, t = (k, p) => LHF.i18n.t(k, p), ui = LHF.ui, E = LHF.engine;

    const c = E.ctx(opts.settings);

    const maxMonth = new Date(today.getFullYear(), today.getMonth() + monthsAhead, 1);

    const next = h('button', { type: 'button', 'aria-label': t('cal.nextMonth'), onClick: () => page(1, next) }, ui.icon('chevR'));

      g.appendChild(headRow);

        const isToday = cell.iso === c.today;
        const low = !!(opts.showLoad && st.ok && st.low);
        const cls = ['cal-day', st.ok ? 'ok' : 'no', isToday ? 'today' : '', low ? 'low' : '', selected === cell.iso ? 'sel' : '', (!st.ok && st.reason === 'today') ? 'urgent' : ''].filter(Boolean).join(' ');

(function () {
  const U = LHF.util, R = LHF.router, t = (k) => LHF.i18n.t(k);

  /* routes */

  R.add('/occasions', () => LHF.pages.occasions(), { name: 'occasions', title: () => t('seo.occasions') });
  R.add('/occasions/:id', (p) => LHF.pages.occasion(p), { name: 'occasion', title: (p) => { const o = LHF.catalog.occasion(p.id); return o ? LHF.i18n.pick(o) : t('seo.notfound'); } });

  R.add('/custom', (p, q) => LHF.pages.custom(p, q), { name: 'custom', title: () => t('seo.custom') });
  R.add('/instagram', (p, q) => LHF.pages.instagram(p, q), { name: 'instagram', title: () => t('seo.instagram') });
  R.add('/story', () => LHF.pages.story(), { name: 'story', title: () => t('seo.story') });
  R.add('/contact', () => LHF.pages.visit(), { name: 'contact', title: () => t('seo.contact') });
  R.add('/order', (p, q) => LHF.pages.order(p, q), { name: 'order', title: () => t('seo.order'), keepScroll: false });
  /* "sent" only for the booking this browser just sent; any other link gets a neutral title,
     since the page may have to say it cannot find the booking */

  R.add('/admin', (p, q) => LHF.pages.admin(p, q), { name: 'admin', title: () => t('seo.admin'), noTransition: true });

    async run(fn) {
      const main = U.qs('#main');
      main.style.transition = 'opacity 160ms var(--ease)'; main.style.opacity = '0';

  };

    LHF.ui.reveal(U.qs('#main'));
    document.body.classList.toggle('no-doorstep', /^\/order/.test(cur.path));
    U.qsa('.nav-main a').forEach((a) => a.classList.toggle('is-active', a.getAttribute('href') !== '#/' && (a.getAttribute('href') || '').replace('#', '') === cur.path.split('/').slice(0, 2).join('/')));
  });

  /* language switch: keep route + draft, re-render with a ribbon pass */
  LHF.i18n.onChange(() => {
    if (!U.reducedMotion()) { const pass = U.h('div.ribbon-pass', U.h('div.band')); document.body.appendChild(pass); setTimeout(() => pass.remove(), 700); }
    setTimeout(() => { LHF.nav.mountAll(); LHF.footer.mount(); R.render(); const m = U.qs('#main'); m.classList.remove('lang-fade'); void m.offsetWidth; m.classList.add('lang-fade'); }, U.reducedMotion() ? 0 : 260);

    if (!link) return;

    paint(); LHF.i18n.onChange(paint);
    link.addEventListener('click', (e) => { e.preventDefault(); const m = U.qs('#main'); m.setAttribute('tabindex', '-1'); m.focus({ preventScroll: false }); });

    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', safeBoot); else safeBoot();
})();
