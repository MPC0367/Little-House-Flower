/* ---- tokens.css ---- */
/* =====================================================================

:root {

  /* Bodoni has no Thai: Thai characters set in the display stack (prices,

  --f-display: 'Bodoni Moda', 'Bodoni 72', Didot, 'Times New Roman', Georgia, 'Anuphan', serif;

  --f-hand: 'Charm', 'Leelawadee UI', cursive;

  --ease: cubic-bezier(.2, .7, .2, 1);

/* ---- base.css ---- */
/* =====================================================================

/* layout */
.wrap { width: 100%; max-width: var(--max); margin-inline: auto; padding-inline: var(--gutter); }

/* hairlines */
.rule { border-top: 1px solid var(--line); }
.rule-ink { border-top: 1px solid var(--ink); }

/* paper sheet */
.sheet {
  background: var(--surface);

  border-radius: var(--radius);
}
.sheet-stack { background: var(--surface); box-shadow: var(--sheet-stack); border-radius: var(--radius); }
.sheet-fold { position: relative; clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%); }

.receipt {

  padding: 28px 24px;
  clip-path: polygon(0 8px, 3% 0, 6% 8px, 9% 0, 12% 8px, 15% 0, 18% 8px, 21% 0, 24% 8px, 27% 0, 30% 8px, 33% 0, 36% 8px, 39% 0, 42% 8px, 45% 0, 48% 8px, 51% 0, 54% 8px, 57% 0, 60% 8px, 63% 0, 66% 8px, 69% 0, 72% 8px, 75% 0, 78% 8px, 81% 0, 84% 8px, 87% 0, 90% 8px, 93% 0, 96% 8px, 100% 0, 100% calc(100% - 8px), 96% 100%, 93% calc(100% - 8px), 90% 100%, 87% calc(100% - 8px), 84% 100%, 81% calc(100% - 8px), 78% 100%, 75% calc(100% - 8px), 72% 100%, 69% calc(100% - 8px), 66% 100%, 63% calc(100% - 8px), 60% 100%, 57% calc(100% - 8px), 54% 100%, 51% calc(100% - 8px), 48% 100%, 45% calc(100% - 8px), 42% 100%, 39% calc(100% - 8px), 36% 100%, 33% calc(100% - 8px), 30% 100%, 27% calc(100% - 8px), 24% 100%, 21% calc(100% - 8px), 18% 100%, 15% calc(100% - 8px), 12% 100%, 9% calc(100% - 8px), 6% 100%, 3% calc(100% - 8px), 0 100%);
}

/* the message card */
.card-paper {
  background: #FBFAF7;
  border: 1px solid #E6E2DA;
  box-shadow: 2px 3px 0 var(--paper-2), 0 12px 24px -16px rgba(47,28,21,.3);
  background-image: linear-gradient(90deg, transparent 49.7%, rgba(47,28,21,.05) 50%, transparent 50.3%);
  position: relative;
}
.card-paper .heart-tag { position: absolute; top: 10px; right: 10px; }

/* utilities */
.flex { display: flex; }
.between { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); }
.center { display: flex; align-items: center; gap: var(--s3); }
.stack > * + * { margin-top: var(--s4); }
.stack-lg > * + * { margin-top: var(--s6); }
.muted { color: var(--muted); }

.rose { color: var(--rose); }

.nowrap { white-space: nowrap; }

.tabular { font-variant-numeric: tabular-nums; }

@media (max-width: 767px) { .only-mobile { display: initial; } .only-desktop { display: none !important; } }

/* horizontal rails */
.rail { display: flex; gap: var(--s4); overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: var(--gutter); padding-bottom: var(--s3); scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; flex: 0 0 auto; }

.rail { align-items: flex-start; }
.rail-bleed { margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); }

/* loader */
.loader { position: fixed; inset: 0; z-index: 400; background: var(--paper); display: grid; place-content: center; justify-items: center; gap: 18px; transition: opacity var(--t) var(--ease), visibility var(--t); }
.loader.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
/* safety valve: the curtain lifts on its own if the boot script never runs */

@keyframes draw { to { stroke-dashoffset: 0; } }

/* toasts */
#toasts { position: fixed; left: 50%; bottom: calc(var(--doorstep-h) + 16px); transform: translateX(-50%); z-index: 350; display: grid; gap: 8px; width: min(92vw, 420px); pointer-events: none; }
@media (min-width: 768px) { #toasts { bottom: 24px; } }
.toast { pointer-events: auto; background: var(--surface); color: var(--ink); box-shadow: var(--sheet-lift); padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-size: 15px; animation: toastIn var(--t) var(--ease); }

/* ---- type.css ---- */
/* =====================================================================
   TYPE — Bodoni Moda (Latin display) · Chonburi (Thai display) · Anuphan
   Thai never gets letter-spacing, italics or tight line-height.
   ===================================================================== */
.display, .h1, .h2, .h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.05; letter-spacing: -.005em; text-wrap: balance; }

:lang(th) .display, :lang(th) .h1, :lang(th) .h2, :lang(th) .h3 { font-family: var(--f-thai-display); letter-spacing: 0; line-height: 1.32; font-weight: 400; }

.display { font-size: clamp(38px, 6.4vw, 84px); font-variation-settings: 'opsz' 96; }

/* ---- buttons: rectangles, folded corner on primary, ribbon-tail on secondary ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 22px; font-family: var(--f-body); font-weight: 500; font-size: 15px; line-height: 1.2; letter-spacing: .01em; border: 1px solid var(--ink); color: var(--ink); background: transparent; border-radius: var(--radius); transition: transform var(--t-fast) var(--ease), background var(--t-fast), color var(--t-fast), box-shadow var(--t-fast); white-space: nowrap; text-align: center; }
